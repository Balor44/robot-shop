apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: robot-shop-discord
  namespace: monitoring
  labels:
    release: monitoring
spec:
  route:
    receiver: discord
    groupBy: ['alertname']
    groupWait: 10s
    repeatInterval: 1h
  receivers:
  - name: discord
    discordConfigs:
    - apiURL:
        name: discord-webhook
        key: url
      sendResolved: true